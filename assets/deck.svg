<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Deck's app icon: Lucide's disc-3 as a neon sign, made like Ferry's (sunset colours on violet) and Mail's (cool
       colours on near black), but round and in lime and green on dark teal, so the three don't mix up side by side -->
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8ff5c"/><stop offset=".5" stop-color="#5cff9d"/><stop offset="1" stop-color="#19c8b4"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-8" y="-8" width="40" height="40"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="512" height="512" fill="#0f2626"/>
  <g transform="translate(76 76) scale(15)" fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.2" filter="url(#glow)">
      <circle cx="12" cy="12" r="10"/>
      <path d="M6 12c0-1.7.7-3.2 1.8-4.2"/>
      <circle cx="12" cy="12" r="2"/>
      <path d="M18 12c0 1.7-.7 3.2-1.8 4.2"/>
    </g>
    <g stroke-width="1.5">
      <circle cx="12" cy="12" r="10"/>
      <path d="M6 12c0-1.7.7-3.2 1.8-4.2"/>
      <circle cx="12" cy="12" r="2"/>
      <path d="M18 12c0 1.7-.7 3.2-1.8 4.2"/>
    </g>
  </g>
</svg>
